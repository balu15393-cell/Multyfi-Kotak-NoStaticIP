plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.multyfikotakneo'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.multyfikotakneo'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '2.6'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
